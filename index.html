<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGOD MOD PANEL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: #0f111a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .panel-container {
            width: 100%;
            max-width: 400px;
            background: rgba(22, 27, 46, 0.95);
            border: 2px solid #ff4655;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 70, 85, 0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .panel-header {
            background: #ff4655;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .panel-body {
            padding: 20px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #8f9ca7;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .display-box {
            background: #111424;
            border: 1px solid #2b3353;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            margin-bottom: 18px;
        }

        .period-num {
            font-size: 18px;
            font-weight: 700;
            color: #00e5ff;
            letter-spacing: 1px;
        }

        .prediction-badge {
            display: inline-block;
            margin-top: 8px;
            font-size: 24px;
            font-weight: 900;
            padding: 4px 20px;
            border-radius: 8px;
            background: #1e2640;
            color: #ffeb3b;
            border: 1px solid #445382;
            text-transform: uppercase;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn {
            background: #1a2238;
            border: 1px solid #3d4d7a;
            color: #fff;
            padding: 12px 10px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn:active {
            transform: scale(0.96);
            background: #ff4655;
            border-color: #ff4655;
        }

        .btn-action {
            width: 100%;
            background: #ff4655;
            border: none;
            color: #fff;
            padding: 14px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 70, 85, 0.4);
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .status-bar {
            margin-top: 15px;
            font-size: 11px;
            text-align: center;
            color: #4caf50;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="panel-container">
        <div class="panel-header">
            <span>SGOD MOD PANEL</span>
            <span style="font-size: 11px; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px;">V1.0</span>
        </div>

        <div class="panel-body">
            <div class="section-title">Current Period & Prediction</div>
            <div class="display-box">
                <div class="period-num" id="period-display">PERIOD: 20260826001</div>
                <div class="prediction-badge" id="predict-result">WAITING</div>
            </div>

            <div class="section-title">Game Mode</div>
            <div class="controls">
                <button class="btn" onclick="setMode('WINGO 1M')">WINGO 1M</button>
                <button class="btn" onclick="setMode('WINGO 3M')">WINGO 3M</button>
            </div>

            <button class="btn-action" onclick="generatePrediction()">GET NEXT PREDICTION</button>

            <div class="status-bar" id="status-text">SYSTEM READY • AI ENGINE ACTIVE</div>
        </div>
    </div>

    <script>
        let currentMode = "WINGO 1M";
        let periodCounter = 1;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById("status-text").innerText = "MODE SET: " + mode;
        }

        function generatePrediction() {
            const results = ["BIG", "SMALL", "RED", "GREEN"];
            const colors = {
                "BIG": "#ff9800",
                "SMALL": "#00e5ff",
                "RED": "#f44336",
                "GREEN": "#4caf50"
            };
            
            const badge = document.getElementById("predict-result");
            const periodDisplay = document.getElementById("period-display");
            
            badge.innerText = "CALCULATING...";
            badge.style.color = "#ffeb3b";

            setTimeout(() => {
                const randomChoice = results[Math.floor(Math.random() * results.length)];
                periodCounter++;
                const formattedPeriod = "20260826" + String(periodCounter).padStart(3, '0');
                
                periodDisplay.innerText = "PERIOD: " + formattedPeriod;
                badge.innerText = randomChoice;
                badge.style.color = colors[randomChoice];
                document.getElementById("status-text").innerText = "PREDICTION GENERATED FOR " + currentMode;
            }, 600);
        }
    </script>
</body>
</html>
